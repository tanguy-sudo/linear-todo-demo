<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Une liste de tâches simple et locale." />
    <title>Focus | Liste de tâches</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="app-card" aria-labelledby="page-title">
        <header class="hero">
          <p class="eyebrow">Linear Todo Demo</p>
          <h1 id="page-title">Une seule liste.<br /><em>Les bonnes priorités.</em></h1>
          <p class="intro">Capture ce qui compte, avance sans bruit et garde tes tâches dans ce navigateur.</p>
        </header>

        <section class="progress-panel" aria-label="Progression">
          <div>
            <p class="section-label">Aujourd'hui</p>
            <p id="progress-copy" class="progress-copy">Aucune tâche pour le moment.</p>
          </div>
          <div class="progress-ring" aria-hidden="true">
            <span id="progress-value">0%</span>
          </div>
        </section>

        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">Nouvelle tâche</label>
          <input id="todo-input" name="title" type="text" maxlength="120" placeholder="Ajouter une tâche..." autocomplete="off" required />
          <label class="sr-only" for="todo-priority">Priorité</label>
          <select id="todo-priority" name="priority" aria-label="Priorité">
            <option value="medium">Normale</option>
            <option value="high">Haute</option>
            <option value="low">Basse</option>
          </select>
          <button type="submit" class="add-button">Ajouter <span aria-hidden="true">+</span></button>
        </form>

        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filtrer les tâches">
            <button type="button" class="filter-button is-active" data-filter="all">Toutes</button>
            <button type="button" class="filter-button" data-filter="open">À faire</button>
            <button type="button" class="filter-button" data-filter="done">Terminées</button>
          </div>
          <button type="button" id="clear-completed" class="clear-button" hidden>Effacer les terminées</button>
        </div>

        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <ul id="todo-list" class="todo-list" aria-label="Tâches"></ul>
      </section>

      <footer class="page-footer">Données conservées localement dans ce navigateur.</footer>
    </main>

    <script type="module" src="src/app.mjs"></script>
  </body>
</html>
