name: Report CI failure

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the failure in the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let pullRequests = run.pull_requests ?? [];

            if (pullRequests.length === 0) {
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
              });
              pullRequests = response.data;
            }

            if (pullRequests.length === 0) {
              core.info('Aucune pull request associée à ce run.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const failedJobs = jobs
              .filter((job) => job.conclusion === 'failure')
              .map((job) => {
                const failedSteps = (job.steps ?? [])
                  .filter((step) => step.conclusion === 'failure')
                  .map((step) => step.name);
                const steps = failedSteps.length ? ` — étapes : ${failedSteps.join(', ')}` : '';
                return `- [${job.name}](${job.html_url})${steps}`;
              })
              .join('\n');
            const failedStepNames = jobs
              .flatMap((job) => (job.steps ?? []).filter((step) => step.conclusion === 'failure').map((step) => step.name))
              .join(' ')
              .toLowerCase();
            const diagnostic = failedStepNames.includes('npm test')
              ? 'Cause probable : un test automatisé échoue. Corriger le comportement ou l assertion concernée, puis relancer la CI.'
              : failedStepNames.includes('npm run check')
                ? 'Cause probable : une erreur de syntaxe JavaScript est détectée. Corriger le fichier signalé dans les logs, puis relancer la CI.'
                : 'Cause indéterminée : consulter les logs du job avant de modifier le code.';
            const logsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`;
            const body = [
              '<!-- ci-failure-report -->',
              '## Échec CI détecté',
              '',
              `Le workflow **${run.name}** a échoué pour le commit \`${run.head_sha.slice(0, 7)}\`.`,
              '',
              '### Jobs en échec',
              failedJobs || '- Voir le run GitHub',
              '',
              `- [Consulter les logs du run](${logsUrl})`,
              `- ${diagnostic}`,
              '- Proposition : appliquer la correction sur la branche de la PR, ajouter ou mettre à jour le test nécessaire, puis relancer la CI.',
              '',
              'Aucune fusion automatique n’est effectuée.',
            ].join('\n');

            for (const pullRequest of pullRequests) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              });
              const existing = comments.find((comment) => comment.body?.includes('<!-- ci-failure-report -->'));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  body,
                });
              }
            }

      - name: Retry failed jobs once
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
